apiVersion: v1
kind: Service
metadata:
  name: boardgame
  namespace: boardgame
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: boardgame
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  loadBalancerSourceRanges:
    - 142.188.187.19/32           # you
    - 52.0.64.164/32  # pipeline smoke test
